name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  # ==========================================================
  # JOB 1 - BUILD AND PUSH IMAGE
  # ==========================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/devsecops-learning-publicrepo:${{ github.sha }} \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/devsecops-learning-publicrepo:${{ github.sha }}

      - name: Verify Docker image
        run: |
          docker images


  # ==========================================================
  # JOB 2 - TRIVY IMAGE SCAN
  # ==========================================================
  scan:
    name: Scan Image with Trivy
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        run: |
          docker pull \
            ghcr.io/${{ github.repository_owner }}/devsecops-learning-publicrepo:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devsecops-learning-publicrepo:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devsecops-learning-publicrepo:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Download Trivy HTML template
        run: |
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o html.tpl

      - name: Generate Trivy HTML report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devsecops-learning-project:${{ github.sha }}
          format: template
          template: '@html.tpl'
          output: trivy-report.html
          severity: CRITICAL,HIGH
          exit-code: '0'


      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/devsecops-learning-publicrepo:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-report.json
            trivy-report.html
